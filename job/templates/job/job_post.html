{% extends 'base.html' %}
{% load static %}

{% block content %}
  <div class="max-w-3xl mx-auto p-6">
    <div class="bg-white shadow-md rounded-lg p-6">
      <h1 class="text-2xl font-bold text-gray-800 mb-6">Post a New Job</h1>
      <form method="post" class="space-y-6">
        {% csrf_token %}

        <!-- Job Title -->
        <div>
          <label for="id_title" class="block mb-2 text-sm font-medium text-gray-900">Job Title</label>
          {{ form.title }}
        </div>

        <!-- Job Description -->
        <div>
          <label for="id_description" class="block mb-2 text-sm font-medium text-gray-900">Description</label>
          {{ form.description }}
        </div>

        <!-- Location -->
        <div class="mb-4">
          <label for="id_location" class="block mb-2 text-sm font-medium text-gray-900">Location</label>
          {{ form.location }}
        </div>

        <!-- Hidden lat/lng fields (required for JS to find them) -->
        {{ form.latitude }}
        {{ form.longitude }}

        <!-- Map container -->
        <div id="map" style="height: 400px;" class="rounded-lg border mb-6"></div>

        <!-- Leaflet -->
        <link
          rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""
        />
        <script
          src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""
        ></script>

        <script>
          document.addEventListener("DOMContentLoaded", function () {
            const latInput = document.getElementById("id_latitude");
            const lngInput = document.getElementById("id_longitude");
            const lat = parseFloat(latInput?.value) || 33.7490;   // Default: Atlanta
            const lng = parseFloat(lngInput?.value) || -84.3880;

            const map = L.map("map").setView([lat, lng], 10);

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
              maxZoom: 19,
              attribution: "&copy; OpenStreetMap contributors",
            }).addTo(map);

            const marker = L.marker([lat, lng], { draggable: true }).addTo(map);

            function updateInputs(lat, lng) {
              latInput.value = lat;
              lngInput.value = lng;
            }

            marker.on("dragend", function (e) {
              const { lat, lng } = e.target.getLatLng();
              updateInputs(lat, lng);
            });

            map.on("click", function (e) {
              const { lat, lng } = e.latlng;
              marker.setLatLng([lat, lng]);
              updateInputs(lat, lng);
            });
          });
        </script>

        <!-- Remote & Visa -->
        <div class="flex items-center space-x-6">
          <div class="flex items-center">
            {{ form.remote }}
            <label for="id_remote" class="ml-2 text-sm text-gray-700">Remote</label>
          </div>
          <div class="flex items-center">
            {{ form.visa_sponsorship }}
            <label for="id_visa_sponsorship" class="ml-2 text-sm text-gray-700">Visa Sponsorship</label>
          </div>
        </div>

        <!-- Skills -->
        <div>
          <label for="id_skills" class="block mb-2 text-sm font-medium text-gray-900">Skills (comma separated)</label>
          {{ form.skills }}
        </div>

        <!-- Submit -->
        <button type="submit" class="w-full text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm px-5 py-2.5 text-center">Save Job</button>
      </form>
    </div>
  </div>
{% endblock %}
