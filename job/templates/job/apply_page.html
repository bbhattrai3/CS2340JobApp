{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto mt-10 bg-white p-8 rounded-lg shadow-md">
  <!-- Job Info -->
  <h2 class="text-2xl font-bold text-gray-800 mb-3">{{ job.title }}</h2>
  <p class="text-gray-600 mb-1"><strong>Location:</strong> {{ job.location|default:'Remote' }}</p>
  <p class="text-gray-600 mb-1"><strong>Skills:</strong> {{ job.skills }}</p>
  <p class="text-gray-600 mb-4"><strong>Salary:</strong> 
    {{ job.salary_min|default:'N/A' }} - {{ job.salary_max|default:'N/A' }}
  </p>

  <hr class="my-4">

  <!-- Application Form -->
  <h3 class="text-xl font-semibold mb-2">Add a Note</h3>
  <form method="POST" class="flex flex-col gap-4">
    {% csrf_token %}
    <textarea name="note" rows="5" 
              class="border border-gray-300 rounded-lg p-3 w-full focus:ring-2 focus:ring-blue-500"
              placeholder="Explain why you’re a good fit for this role..."></textarea>

    <div class="flex justify-end gap-3">
      <a href="{% url 'job:job_search' %}"
         class="px-4 py-2 bg-gray-300 rounded-lg text-gray-800 hover:bg-gray-400">
        Cancel
      </a>
      <button type="submit"
              class="px-6 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition">
        Submit Application
      </button>
    </div>
  </form>
</div>
{% endblock %}
